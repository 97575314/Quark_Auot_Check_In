name: Quark签到

on:
  schedule:
    - cron: '0 2 * * *'   # 北京时间 10:00 (UTC+8 -> UTC+2)
    - cron: '0 3 * * *'   # 北京时间 11:00 (UTC+8 -> UTC+3)
    - cron: '0 4 * * *'   # 北京时间 12:00 (UTC+8 -> UTC+4)
  workflow_dispatch:      # 允许手动触发

jobs:
  sign-in:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 在 10:00-12:59 北京时间内随机延迟
        run: |
          delay=$((RANDOM % 3600))
          echo "北京时间 10:00-12:59 之间随机延迟 $delay 秒后开始.."
          sleep $delay

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: 安装依赖
        run: pip install requests

      - name: 执行签到脚本
        env:
          COOKIE_QUARK: ${{ secrets.COOKIE_QUARK }}
        run: python checkIn_Quark.py

      - name: 清理旧的工作流记录
        uses: Mattraks/delete-workflow-runs@main
        if: always()
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 60
